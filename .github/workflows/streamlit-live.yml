name: Streamlit Live Planner Checks
on:
  push:
    branches:
      - upgrade/streamlit-live-planner
  pull_request:
    paths:
      - 'streamlit_live.py'
      - 'streamlit_app.py'
      - 'requirements.txt'
      - 'tests/test_streamlit_live.py'
      - '.github/workflows/streamlit-live.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q streamlit_app.py streamlit_live.py
      - run: python -m unittest discover -s tests -p 'test_streamlit_live.py' -v
      - run: python -c 'import streamlit_app' 
